<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Core Orb Neon Gradient -->
    <linearGradient id="orbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Glowing Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="30" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base Container with Rounded Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="4"/>

  <!-- Subtle Cyber Grid / Radial Nodes -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#6366f1" stroke-opacity="0.15" stroke-width="2" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#a855f7" stroke-opacity="0.2" stroke-width="2"/>

  <!-- Orbital Rings with Glowing Particle Accents -->
  <ellipse cx="256" cy="256" rx="160" ry="60" fill="none" stroke="url(#ringGrad)" stroke-width="4" transform="rotate(-30 256 256)" filter="url(#neonGlow)"/>
  <ellipse cx="256" cy="256" rx="160" ry="60" fill="none" stroke="url(#ringGrad)" stroke-width="3" transform="rotate(35 256 256)" opacity="0.75"/>

  <!-- Central Glowing Neural Energy Core -->
  <circle cx="256" cy="256" r="76" fill="url(#orbGrad)" filter="url(#neonGlow)"/>

  <!-- Inner Dynamic Soundwaves / Voice Frequency Chevron -->
  <path d="M 216 236 Q 256 200 296 236 Q 256 272 216 236 Z" fill="#ffffff" opacity="0.9" filter="url(#neonGlow)"/>
  <path d="M 230 256 L 256 290 L 282 256" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Core Pulsing Nodes -->
  <circle cx="256" cy="180" r="6" fill="#38bdf8" filter="url(#neonGlow)"/>
  <circle cx="330" cy="256" r="5" fill="#ec4899" filter="url(#neonGlow)"/>
  <circle cx="182" cy="256" r="5" fill="#06b6d4" filter="url(#neonGlow)"/>
  <circle cx="256" cy="332" r="6" fill="#a855f7" filter="url(#neonGlow)"/>

  <!-- Top Lighting Glint -->
  <ellipse cx="235" cy="225" rx="35" ry="18" fill="#ffffff" opacity="0.4" transform="rotate(-25 235 225)"/>
</svg>
